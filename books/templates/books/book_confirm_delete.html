{% extends 'core/base.html' %}
{% block content %}
<h2>Delete "{{ book.title }}"?</h2>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'books:book_detail' book.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
