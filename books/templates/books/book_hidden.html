{% extends 'core/base.html' %}
{% block title %}Listing unavailable - BookBridge{% endblock %}

{% block content %}
<div class="bb-page">
    <div class="bb-panel" style="max-width:720px; margin:0 auto; text-align:center; padding:52px 28px;">
        <div style="font-size:3.6rem;">🚫</div>
        <h1 class="fw-bold mt-3" style="font-size:1.5rem;">This listing is unavailable</h1>
        <p class="text-muted">
            It was hidden by our moderation team after a report. If you are the seller,
            contact support to appeal.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
            <a href="{% url 'books:book_list' %}" class="bb-btn bb-btn-primary">Browse similar books</a>
            <a href="{% url 'core:home' %}" class="bb-btn bb-btn-outline">Go home</a>
        </div>
    </div>
</div>
{% endblock %}
