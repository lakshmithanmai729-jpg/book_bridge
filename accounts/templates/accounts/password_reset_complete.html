{% extends 'core/base.html' %}
{% block title %}Password updated - BookBridge{% endblock %}

{% block content %}
<div class="bb-page">
    <div class="bb-panel" style="max-width:640px; margin:0 auto; text-align:center;">
        <div class="bb-empty-icon" style="background:#ecfdf5; color:#10b981;"><i class="bi bi-shield-check"></i></div>
        <h1 class="fw-bold" style="font-size:1.4rem;">Password changed</h1>
        <p class="text-muted">Your new password is saved. You can sign in with it right away.</p>
        <a href="{% url 'accounts:login' %}" class="bb-btn bb-btn-primary mt-2">Sign in</a>
    </div>
</div>
{% endblock %}
