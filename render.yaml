# BookBridge — one-click deploy on Render (free tier).
#   Dashboard → New → Blueprint → pick this repo → Apply.
# Everything below is read automatically; no manual setting is required.
services:
  - type: web
    name: bookbridge
    runtime: python
    plan: free
    region: singapore          # closest free region to India; change if you prefer
    branch: master             # deploys automatically on every merge to master
    # Only build artefacts here — the database is not guaranteed to be awake
    # while a build runs, and a failed migration used to fail the whole build.
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    # Everything that touches the database runs at boot, when it is definitely
    # reachable: migrate, demo content, covers, the owner's admin, then a short
    # report of what we are actually connected to (visible in the logs).
    startCommand: |
      python manage.py migrate --noinput &&
      python manage.py seed_demo --if-empty &&
      python manage.py ensure_demo_media &&
      python manage.py ensure_admin &&
      python manage.py db_status &&
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /healthz/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true          # Render creates a strong key for you
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      # Your database. The block at the bottom of this file creates a free
      # Render Postgres, which EXPIRES 30 DAYS AFTER CREATION. To keep your
      # data for good, replace this value with a Neon connection string
      # (see NEON.md) — Neon's free plan does not expire.
      - key: DATABASE_URL
        fromDatabase:
          name: bookbridge-db
          property: connectionString
      # Fill the marketplace with demo books/photos/chats. The demo accounts
      # get unusable passwords, so nobody can sign in as them. Remove this for
      # a real marketplace.
      - key: DEMO_MODE
        value: "1"
      # Keep uploaded photos in the database. A free instance's disk is wiped
      # on every restart, so this is what stops covers from disappearing.
      - key: MEDIA_STORAGE
        value: "db"
      # Email is printed to the Render logs until you add SMTP credentials.
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      # Your admin login. Set these in Dashboard → Environment and the next
      # deploy creates (or updates) the superuser automatically.
      #   DJANGO_SUPERUSER_USERNAME = your-name
      #   DJANGO_SUPERUSER_EMAIL    = you@example.com
      #   DJANGO_SUPERUSER_PASSWORD = a long password you keep safe
      #
      # Real email (verification + password reset) needs SMTP credentials:
      #   EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      #   EMAIL_HOST, EMAIL_PORT, EMAIL_USE_TLS, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD

databases:
  - name: bookbridge-db
    plan: free
    region: singapore
    databaseName: bookbridge
    user: bookbridge
