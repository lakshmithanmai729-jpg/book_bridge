{% extends 'core/base.html' %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">📚 Welcome to Book Bridge!</h1>
    <p class="lead">Buy and sell used books easily.</p>
    {% if user.is_authenticated %}
        <p class="fs-5">Hello, <strong>{{ user.username }}</strong>!</p>
    {% else %}
        <a href="{% url 'accounts:signup' %}" class="btn btn-primary btn-lg me-2">Sign Up</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary btn-lg">Login</a>
    {% endif %}
</div>
{% endblock %}
