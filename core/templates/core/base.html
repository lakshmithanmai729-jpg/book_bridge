<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Book Bridge{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'core:home' %}">📚 Book Bridge</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'books:book_list' %}">Browse Books</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'books:book_add' %}">Add Book</a>
                <a class="nav-link" href="{% url 'accounts:profile' %}">My Profile</a>
                <a class="nav-link" href="{% url 'password_change' %}">Change Password</a>
                <a class="nav-link" href="{% url 'accounts:logout' %}">Logout ({{ user.username }})</a>
            {% else %}
                <a class="nav-link" href="{% url 'accounts:signup' %}">Sign Up</a>
                <a class="nav-link" href="{% url 'accounts:login' %}">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
