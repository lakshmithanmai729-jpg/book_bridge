{% extends 'core/base.html' %}
{% block title %}Page not found - BookBridge{% endblock %}

{% block content %}
<div class="bb-page">
    <div class="bb-panel" style="max-width:720px; margin:0 auto; text-align:center; padding:56px 28px;">
        <div style="font-size:4rem; line-height:1;">📚</div>
        <h1 class="fw-bold mt-3" style="font-size:1.7rem;">This page went missing</h1>
        <p class="text-muted">
            The page or listing you were looking for may have been sold, deleted or moved.
        </p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
            <a href="{% url 'core:home' %}" class="bb-btn bb-btn-primary">Go home</a>
            <a href="{% url 'books:book_list' %}" class="bb-btn bb-btn-outline">Browse books</a>
            <a href="{% url 'accounts:request_book' %}" class="bb-btn bb-btn-soft">Request a book</a>
        </div>
    </div>
</div>
{% endblock %}
