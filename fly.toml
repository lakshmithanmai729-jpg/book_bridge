# BookBridge on Fly.io — `fly launch --no-deploy` then `fly deploy`.
app = "bookbridge"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev"
  SECURE_SSL_REDIRECT = "True"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
